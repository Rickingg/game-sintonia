<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo Sintonia</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:Arial,Helvetica,sans-serif;
    background:#fef3c7;
    min-height:100vh;
}

/* TELAS */
.tela{display:none;min-height:100vh;padding:1rem}
.ativa{display:block}

/* TOPO */
.topo{
    display:flex;
    align-items:center;
    gap:.5rem;
    margin-bottom:1rem;
}
.voltar{
    font-size:1.5rem;
    cursor:pointer;
    color:#7c3aed;
    font-weight:bold;
}
.titulo{
    font-size:1.4rem;
    font-weight:bold;
    color:#7c3aed;
}

/* INÍCIO */
#inicio{
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
}
.caixa-inicio{max-width:420px;width:100%}
h1{
    color:#7c3aed;
    margin-bottom:1.5rem;
    font-size:2.5rem;
}

/* BOTÕES */
.botao{
    width:100%;
    padding:1rem;
    margin-bottom:.8rem;
    border:none;
    border-radius:1rem;
    font-size:1.1rem;
    font-weight:bold;
    cursor:pointer;
}
.auto{background:#7c3aed;color:white}
.manual{background:#fde68a}
.fav{background:#fb7185;color:white}

/* CARTA */
.carta-container{
    max-width:380px;
    margin:1rem auto;
}
.carta{
    display:flex;
    border-radius:1rem;
    overflow:hidden;
    aspect-ratio:3/2;
    box-shadow:0 10px 20px rgba(0,0,0,.2);
}
.lado{
    width:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:.8rem;
    text-align:center;
    position:relative;
    font-weight:600;
}
.esq{background:#fda4af}
.dir{background:#86efac}

.seta{
    position:absolute;
    top:6px;
    font-size:1.2rem;
}
.seta-esq{left:8px}
.seta-dir{right:8px}

/* AÇÕES */
.acoes{
    display:flex;
    justify-content:center;
    gap:.6rem;
    flex-wrap:wrap;
}
.acao{
    padding:.6rem 1rem;
    border:none;
    border-radius:1.2rem;
    font-weight:bold;
    cursor:pointer;
}
.nova{background:#22c55e;color:white}
.favoritar{background:#e5e7eb}
.favoritar.ativo{background:#ef4444;color:white}

/* LISTAS */
.lista{
    background:white;
    border-radius:1rem;
    padding:1rem;
    max-width:600px;
    margin:0 auto;
}
.item{
    padding:.7rem;
    border-radius:.6rem;
    cursor:pointer;
}
.item:hover{background:#f3f4f6}

/* HORIZONTAL */
@media (orientation:landscape){
    .carta-container{max-width:520px}
}
</style>
</head>

<body>

<!-- INÍCIO -->
<div id="inicio" class="tela ativa">
    <div class="caixa-inicio">
        <h1>🎴 Jogo Sintonia</h1>
        <button class="botao auto" onclick="abrirAuto()">🎴 Carta Automática</button>
        <button class="botao manual" onclick="abrirManual()">📝 Escolher Manualmente</button>
        <button class="botao fav" onclick="abrirFavoritos()">⭐ Favoritos (<span id="cont">0</span>)</button>
    </div>
</div>

<!-- AUTOMÁTICA -->
<div id="auto" class="tela">
    <div class="topo">
        <span class="voltar" onclick="inicio()">←</span>
        <span class="titulo">Carta Automática</span>
    </div>
    <div id="areaCarta"></div>
    <div class="acoes">
        <button class="acao favoritar" id="btnFav" onclick="toggleFav()">❤️</button>
        <button class="acao nova" onclick="sortear()">🔄</button>
    </div>
</div>

<!-- MANUAL -->
<div id="manual" class="tela">
    <div class="topo">
        <span class="voltar" onclick="inicio()">←</span>
        <span class="titulo">Escolher Carta</span>
    </div>
    <div class="lista" id="listaManual"></div>
</div>

<!-- FAVORITOS -->
<div id="favoritos" class="tela">
    <div class="topo">
        <span class="voltar" onclick="inicio()">←</span>
        <span class="titulo">Favoritos</span>
    </div>
    <div class="lista" id="listaFav"></div>
</div>

<script>
const CARTAS = [
/* === 150 CARTAS === */
${Array.from({length:150},(_,i)=>i+1).map(n=>`{id:${n},e:"${[
"Mais impulsivo","Doce mais gostoso","Mais romântico","Melhor filme","Matéria mais difícil",
"Melhor desculpa","Superpoder mais inútil","Mais falso","Dia mais cansativo","Coisa mais nojenta",
"Mais organizado","Pizza melhor sabor","Melhor presente","Melhor jogo","Coisa mais sem noção",
"Poder mais perigoso","Mais confiável","Professor mais rígido","Situação mais vergonhosa","Mais atrasado"
][(n-1)%20]}",d:"${[
"Mais racional","Doce mais ruim","Menos romântico","Pior filme","Mais fácil",
"Pior desculpa","Mais útil","Menos falso","Mais leve","Menos nojenta",
"Mais bagunceiro","Pior sabor","Pior presente","Pior jogo","Mais sensata",
"Menos perigoso","Menos confiável","Mais tranquilo","Menos vergonhosa","Mais pontual"
][(n-1)%20]}"}`
).join(",")}
];

let atual=null;
let favs=JSON.parse(localStorage.getItem("favs")||"[]");

function tela(id){
document.querySelectorAll(".tela").forEach(t=>t.classList.remove("ativa"));
document.getElementById(id).classList.add("ativa");
}

function inicio(){tela("inicio")}
function abrirAuto(){sortear();tela("auto")}
function abrirManual(){
let html="";
CARTAS.forEach(c=>{
html+=`<div class="item" onclick="mostrar(${c.id})">#${c.id} - ${c.e} ←→ ${c.d}</div>`;
});
document.getElementById("listaManual").innerHTML=html;
tela("manual");
}
function abrirFavoritos(){
let html="";
favs.forEach(c=>{
html+=`<div class="item" onclick="mostrar(${c.id})">#${c.id} - ${c.e} ←→ ${c.d}</div>`;
});
document.getElementById("listaFav").innerHTML=html||"Sem favoritas";
tela("favoritos");
}

function mostrar(id){
atual=CARTAS.find(c=>c.id===id);
render();
tela("auto");
}

function sortear(){
atual=CARTAS[Math.floor(Math.random()*CARTAS.length)];
render();
}

function render(){
document.getElementById("areaCarta").innerHTML=
`<div class="carta-container">
<div class="carta">
<div class="lado esq"><span class="seta seta-esq">←</span>${atual.e}</div>
<div class="lado dir"><span class="seta seta-dir">→</span>${atual.d}</div>
</div></div>`;
btn();
}

function toggleFav(){
let i=favs.findIndex(f=>f.id===atual.id);
if(i>-1)favs.splice(i,1); else favs.push(atual);
localStorage.setItem("favs",JSON.stringify(favs));
btn();cont();
}

function btn(){
let b=document.getElementById("btnFav");
if(favs.some(f=>f.id===atual.id)) b.classList.add("ativo");
else b.classList.remove("ativo");
}

function cont(){document.getElementById("cont").innerText=favs.length}
cont();
</script>

</body>
</html>
